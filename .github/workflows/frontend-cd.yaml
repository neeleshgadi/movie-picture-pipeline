name: Frontend CD

on:
  push:
    branches:
      - main
    paths:
      - starter/frontend/**
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            starter/frontend/node_modules
          key: \${{ runner.os }}-frontend-\${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            \${{ runner.os }}-frontend-
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            starter/frontend/node_modules
          key: \${{ runner.os }}-frontend-\${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            \${{ runner.os }}-frontend-
      - run: npm ci
      - run: CI=true npm test -- --watchAll=false

  build-and-deploy:
    needs: [lint, test]
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: frontend
      REACT_APP_MOVIE_API_URL: \${{ vars.REACT_APP_MOVIE_API_URL || 'http://localhost:5000' }}
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            starter/frontend/node_modules
          key: \${{ runner.os }}-frontend-\${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            \${{ runner.os }}-frontend-
      - run: npm ci
      - run: CI=true npm test -- --watchAll=false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: \${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: \${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: \${{ vars.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        env:
          ECR_REGISTRY: \${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --build-arg REACT_APP_MOVIE_API_URL="$REACT_APP_MOVIE_API_URL" --tag "$ECR_REGISTRY/$ECR_REPOSITORY:\${GITHUB_SHA}" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:\${GITHUB_SHA}"
      - uses: imranismail/setup-kustomize@v2
      - name: Configure EKS access
        run: aws eks update-kubeconfig --region "\${{ vars.AWS_REGION }}" --name "\${{ vars.EKS_CLUSTER_NAME }}"
      - name: Deploy Kubernetes manifests
        working-directory: starter/frontend/k8s
        env:
          ECR_REGISTRY: \${{ steps.login-ecr.outputs.registry }}
        run: |
          kustomize edit set image "frontend=$ECR_REGISTRY/$ECR_REPOSITORY:\${GITHUB_SHA}"
          kustomize build | kubectl apply -f -